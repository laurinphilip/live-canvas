    <rect x="108" y="318" width="96" height="7" rx="3.5" fill="#ffffff" opacity=".38"/>

    <rect x="1034" y="61" width="168" height="88" rx="14" fill="#34263e" stroke="#e879f9" stroke-width="2"/>
    <rect x="1048" y="77" width="62" height="8" rx="4" fill="#e879f9"/>
    <rect x="1048" y="96" width="126" height="7" rx="3.5" fill="#ffffff" opacity=".72"/>
